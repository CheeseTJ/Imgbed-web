name: Deploy Worker

# push 到 main 自动构建并部署到 Cloudflare Worker（img.taojun.top）。
#
# 为什么不走 Cloudflare Workers Builds：
#   Workers Builds 需要在控制台连 Git 仓库（OAuth），且其构建记录没有公开的
#   REST API（/accounts/<id>/builds/* 恒 401），无法被 CICD 控制台采集。
#   这里用 self-hosted runner + wrangler，链路与其它服务一致、可审计。
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false # 保留 node_modules 加速构建

      - name: Build + Deploy
        run: |
          export PATH=/usr/local/bin:$PATH
          npm ci --no-audit --no-fund
          npm run build
          # token 来自宿主机单一来源，避免写进仓库
          export CLOUDFLARE_API_TOKEN="$(cat /home/ubuntu/server/secrets/cloudflare/mcp-token 2>/dev/null \
            || grep '^CLOUDFLARE_API_TOKEN=' /home/ubuntu/server/secrets/cicd/.env | cut -d= -f2- | tr -d '\"')"
          export CLOUDFLARE_ACCOUNT_ID="1b53bebb48213cfdf6e43cd71d931741"
          npx wrangler deploy
